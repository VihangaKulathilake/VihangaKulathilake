name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate self-hosted stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          from collections import Counter

          user = os.environ["PROFILE_USER"]
          token = os.environ["GH_TOKEN"]
          headers = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28"}

          def api(path, params=None):
              url = "https://api.github.com" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          profile = api(f"/users/{user}")
          repos = []
          page = 1
          while True:
              batch = api(f"/users/{user}/repos", {"per_page":100,"page":page,"type":"owner","sort":"updated"})
              if not batch: break
              repos.extend(batch)
              if len(batch) < 100: break
              page += 1

          stars = sum(r.get("stargazers_count",0) for r in repos)
          forks = sum(r.get("forks_count",0) for r in repos)
          watchers = sum(r.get("watchers_count",0) for r in repos)

          langs = Counter()
          for r in repos:
              try:
                  data = api(f"/repos/{user}/{r['name']}/languages")
                  langs.update(data)
              except Exception:
                  pass
          total_lang = sum(langs.values()) or 1
          top_langs = langs.most_common(8)

          def search_count(q):
              try: return api("/search/issues", {"q":q,"per_page":1}).get("total_count",0)
              except Exception: return 0

          prs = search_count(f"author:{user} is:pr")
          merged_prs = search_count(f"author:{user} is:pr is:merged")
          issues = search_count(f"author:{user} is:issue")
          commits = search_count(f"author:{user} committer-date:2025-01-01..2099-12-31")
          
          rows = [
              ("PUBLIC REPOS", str(profile.get("public_repos",0))),
              ("FOLLOWERS", str(profile.get("followers",0))),
              ("FOLLOWING", str(profile.get("following",0))),
              ("STARS", str(stars)),
              ("FORKS", str(forks)),
              ("COMMITS", str(commits)),
              ("PULL REQUESTS", str(prs)),
              ("MERGED PRS", str(merged_prs)),
              ("ISSUES", str(issues)),
          ]

          W,H=1000,620
          bg="#0d1117"; fg="#f0f6fc"; muted="#8b949e"; line="#30363d"; accent="#58a6ff"
          out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">']
          out += [f'<rect width="100%" height="100%" rx="18" fill="{bg}"/>',
                  f'<text x="45" y="55" fill="{fg}" font-family="Arial,sans-serif" font-size="25" font-weight="700">GitHub Profile Analytics</text>',
                  f'<text x="45" y="82" fill="{muted}" font-family="Arial,sans-serif" font-size="14">Live data generated by GitHub Actions • @{user}</text>']
          for i,(label,val) in enumerate(rows):
              x=45+(i%3)*305; y=112+(i//3)*92
              out += [f'<rect x="{x}" y="{y}" width="275" height="72" rx="12" fill="#161b22" stroke="{line}"/>',
                      f'<text x="{x+18}" y="{y+27}" fill="{muted}" font-family="Arial,sans-serif" font-size="11" font-weight="700">{label}</text>',
                      f'<text x="{x+18}" y="{y+57}" fill="{fg}" font-family="Arial,sans-serif" font-size="25" font-weight="700">{val}</text>']
          out += [f'<text x="45" y="408" fill="{fg}" font-family="Arial,sans-serif" font-size="18" font-weight="700">Language Distribution</text>']
          y=438
          for lang,n in top_langs:
              pct=n/total_lang*100
              out += [f'<text x="45" y="{y}" fill="{fg}" font-family="Arial,sans-serif" font-size="13">{lang}</text>',
                      f'<rect x="180" y="{y-12}" width="600" height="14" rx="7" fill="#21262d"/>',
                      f'<rect x="180" y="{y-12}" width="{600*pct/100:.1f}" height="14" rx="7" fill="{accent}"/>',
                      f'<text x="805" y="{y}" fill="{muted}" font-family="Arial,sans-serif" font-size="13">{pct:.1f}%</text>']
              y+=21
          out += [f'<text x="45" y="600" fill="{muted}" font-family="Arial,sans-serif" font-size="11">Updated automatically every day.</text>','</svg>']
          os.makedirs("profile",exist_ok=True)
          open("profile/github-stats.svg","w",encoding="utf-8").write("\n".join(out))
          open("profile/top-langs.svg","w",encoding="utf-8").write("\n".join(out))
          PY

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub profile statistics"
          git push
